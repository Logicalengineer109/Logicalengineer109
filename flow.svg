<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>How I work: Understand, Model, Build, Test, Operate</title>
  <defs>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="100" y1="0" x2="900" y2="0">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#8957e5"/>
    </linearGradient>
    <style>
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
      .num { fill: #58a6ff; font-size: 13px; font-weight: 700; letter-spacing: 1px; }
      .head { fill: #f0f6fc; font-size: 19px; font-weight: 700; }
      .text { fill: #8b949e; font-size: 13px; }
      .dot { fill: #0d1117; stroke: url(#line); stroke-width: 3; }
      .pulse { fill: #58a6ff; }
      @keyframes glow { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
      .pulse { animation: glow 2.4s ease-in-out infinite; }
      .p2 { animation-delay: .4s } .p3 { animation-delay: .8s } .p4 { animation-delay: 1.2s } .p5 { animation-delay: 1.6s }
    </style>
  </defs>

  <rect width="1000" height="230" rx="14" fill="#0d1117"/>
  <line x1="100" y1="42" x2="900" y2="42" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>

  <g>
    <circle class="dot" cx="100" cy="42" r="11"/><circle class="pulse" cx="100" cy="42" r="5"/>
    <rect class="card" x="16" y="70" width="168" height="140" rx="12"/>
    <text class="num" x="32" y="98">01</text>
    <text class="head" x="32" y="124">Understand</text>
    <text class="text" x="32" y="150">The business ask,</text>
    <text class="text" x="32" y="168">the sources and who</text>
    <text class="text" x="32" y="186">reads the numbers</text>
  </g>
  <g>
    <circle class="dot" cx="300" cy="42" r="11"/><circle class="pulse p2" cx="300" cy="42" r="5"/>
    <rect class="card" x="216" y="70" width="168" height="140" rx="12"/>
    <text class="num" x="232" y="98">02</text>
    <text class="head" x="232" y="124">Model</text>
    <text class="text" x="232" y="150">Grain, facts and</text>
    <text class="text" x="232" y="168">dimensions, contracts</text>
    <text class="text" x="232" y="186">and metrics defined</text>
  </g>
  <g>
    <circle class="dot" cx="500" cy="42" r="11"/><circle class="pulse p3" cx="500" cy="42" r="5"/>
    <rect class="card" x="416" y="70" width="168" height="140" rx="12"/>
    <text class="num" x="432" y="98">03</text>
    <text class="head" x="432" y="124">Build</text>
    <text class="text" x="432" y="150">Incremental and</text>
    <text class="text" x="432" y="168">idempotent pipelines</text>
    <text class="text" x="432" y="186">in SQL, Spark, dbt</text>
  </g>
  <g>
    <circle class="dot" cx="700" cy="42" r="11"/><circle class="pulse p4" cx="700" cy="42" r="5"/>
    <rect class="card" x="616" y="70" width="168" height="140" rx="12"/>
    <text class="num" x="632" y="98">04</text>
    <text class="head" x="632" y="124">Test</text>
    <text class="text" x="632" y="150">Schema tests, data</text>
    <text class="text" x="632" y="168">quality checks and</text>
    <text class="text" x="632" y="186">CI on every PR</text>
  </g>
  <g>
    <circle class="dot" cx="900" cy="42" r="11"/><circle class="pulse p5" cx="900" cy="42" r="5"/>
    <rect class="card" x="816" y="70" width="168" height="140" rx="12"/>
    <text class="num" x="832" y="98">05</text>
    <text class="head" x="832" y="124">Operate</text>
    <text class="text" x="832" y="150">Freshness SLAs,</text>
    <text class="text" x="832" y="168">alerts, runbooks</text>
    <text class="text" x="832" y="186">and cost control</text>
  </g>
</svg>
